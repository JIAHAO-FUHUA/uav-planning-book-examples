name: Chapter example checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python examples
        run: python tools/run_checks.py
      - name: Configure C++17 examples
        run: cmake -S . -B build
      - name: Build C++17 examples
        run: cmake --build build --config Release --parallel
      - name: Check C++17 examples
        run: ctest --test-dir build -C Release --output-on-failure
